name: Build Compiler and Compile MicroASM Program

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-compile:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $GITHUB_PATH
      - name: Install GoLink
        shell: cmd
        run: |
          mkdir GoLink
          curl.exe -sSL "https://www.godevtool.com/golink.zip" -o "golink.zip"
          tar -xf golink.zip -C GoLink
          echo %CD%\GoLink>> %GITHUB_PATH%

      - name: Compile Compiler Engine Formats
        run: |
          # 1. Assemble object file for linking
          nasm -f win64 compiler.asm -o compiler.obj

          # 2. Link executable target
          GoLink /entry _start compiler.obj kernel32.dll /fo compiler.exe

          # 3. Link dynamic library target
          GoLink /dll /entry DllMain compiler.obj kernel32.dll /fo compiler.dll

          # 4. Assemble position-independent binary flat image
          nasm -f bin compiler.asm -o compiler.bin

      - name: Create Mock Program File If Missing
        run: |
          if (-not (Test-Path "program.masm")) {
              Set-Content -Path "program.masm" -Value "set add sub"
              Write-Output "[*] Created temporary program.masm for compilation test."
          }

      - name: Execute Compiler Engine on MicroASM Source
        run: |
          .\compiler.exe
          Write-Output "[+] Native compiler engine completed processing."

      - name: Clean up Build Artifacts
        run: |
          if (Test-Path compiler.obj) { Remove-Item compiler.obj }
          if (Test-Path golink.zip) { Remove-Item golink.zip }

      - name: Commit and Push All Generated Formats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add compiler.exe compiler.dll compiler.bin
          
          if (Test-Path "output.bin") {
              git add output.bin
          }
          
          $gitStatus = git status --porcelain
          if ($gitStatus) {
              git commit -m "Auto-compile: Updated binaries and compiled MicroASM output [skip ci]"
              git push
              Write-Output "[+] Successfully updated repository with new binaries."
          } else {
              Write-Output "[-] No file alterations detected. Skipping deployment push."
          }
